version: '3.8'

services:
  smart-omr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_omr_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./smart_omr.db
    volumes:
      # Persist SQLite database and student uploads
      - omr_data:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  omr_data:
